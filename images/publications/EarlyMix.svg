<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">EarlyMix hierarchical mixing overview</title>
  <desc id="desc">Partial time-series prefixes pass through sample mixing, an encoder, latent mixing, and an early classifier.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="bluePurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#7b61ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#38577a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7290b3"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#background)"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#17395f">EarlyMix</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#607a99">Hierarchical mixing for early time-series classification</text>

  <path d="M 342 136 C 342 116, 362 112, 382 112 L 884 112 C 904 112, 924 116, 924 136" fill="none" stroke="#7b61ff" stroke-width="3" stroke-linecap="round"/>
  <text x="633" y="134" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#6b55d9">HIERARCHICAL MIXING</text>

  <g filter="url(#shadow)">
    <rect x="35" y="165" width="255" height="280" rx="22" fill="#ffffff" stroke="#cbdcf0" stroke-width="2"/>
    <rect x="340" y="165" width="220" height="280" rx="22" fill="#ffffff" stroke="#d8d0ff" stroke-width="2"/>
    <rect x="610" y="217" width="135" height="176" rx="22" fill="#ffffff" stroke="#cbdcf0" stroke-width="2"/>
    <rect x="795" y="165" width="220" height="280" rx="22" fill="#ffffff" stroke="#d8d0ff" stroke-width="2"/>
    <rect x="1065" y="165" width="100" height="280" rx="22" fill="#ffffff" stroke="#cbdcf0" stroke-width="2"/>
  </g>

  <text x="162" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17395f">Time-Series Prefix</text>
  <line x1="70" y1="370" x2="255" y2="370" stroke="#b6c8dc" stroke-width="2"/>
  <line x1="70" y1="245" x2="70" y2="370" stroke="#b6c8dc" stroke-width="2"/>
  <path d="M 72 332 C 92 310, 108 278, 126 292 S 158 350, 177 320 S 207 258, 230 281" fill="none" stroke="#2f80ed" stroke-width="7" stroke-linecap="round"/>
  <path d="M 72 286 C 93 250, 111 267, 128 315 S 164 332, 180 286 S 208 304, 230 341" fill="none" stroke="#ef5da8" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <line x1="232" y1="238" x2="232" y2="379" stroke="#7b61ff" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="162" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#607a99">incomplete observations</text>

  <text x="450" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#6b55d9">Sample Mixing</text>
  <rect x="377" y="246" width="94" height="30" rx="15" fill="#dcecff"/>
  <rect x="429" y="291" width="94" height="30" rx="15" fill="#f9d8e9"/>
  <path d="M 389 260 L 512 306" stroke="#7b61ff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 389 306 L 512 260" stroke="#2f80ed" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <circle cx="401" cy="260" r="8" fill="#2f80ed"/>
  <circle cx="499" cy="306" r="8" fill="#ef5da8"/>
  <rect x="376" y="350" width="148" height="42" rx="21" fill="url(#bluePurple)" opacity="0.9"/>
  <text x="450" y="377" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">DATA SPACE</text>

  <text x="677" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17395f">Encoder</text>
  <rect x="641" y="280" width="73" height="73" rx="18" fill="url(#bluePurple)"/>
  <path d="M 658 303 H 697 M 658 317 H 697 M 658 331 H 685" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <text x="905" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#6b55d9">Latent Mixing</text>
  <g opacity="0.95">
    <circle cx="847" cy="275" r="18" fill="#2f80ed"/>
    <circle cx="902" cy="248" r="18" fill="#7b61ff"/>
    <circle cx="961" cy="276" r="18" fill="#ef5da8"/>
    <circle cx="872" cy="327" r="18" fill="#7b61ff"/>
    <circle cx="932" cy="331" r="18" fill="#2f80ed"/>
    <path d="M 848 275 L 902 248 L 961 276 L 932 331 L 872 327 Z M 902 248 L 932 331 M 848 275 L 932 331" fill="none" stroke="#9cb0ca" stroke-width="4"/>
  </g>
  <rect x="831" y="350" width="148" height="42" rx="21" fill="url(#bluePurple)" opacity="0.9"/>
  <text x="905" y="377" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">FEATURE SPACE</text>

  <text x="1115" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17395f">Early</text>
  <text x="1115" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17395f">Decision</text>
  <circle cx="1115" cy="300" r="35" fill="#e8f6ef" stroke="#38a169" stroke-width="3"/>
  <path d="M 1097 300 L 1109 312 L 1135 286" fill="none" stroke="#38a169" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1115" cy="374" r="27" fill="#fff4d8" stroke="#d69e2e" stroke-width="3"/>
  <path d="M 1115 357 V 375 L 1128 382" fill="none" stroke="#d69e2e" stroke-width="5" stroke-linecap="round"/>

  <line x1="292" y1="305" x2="329" y2="305" stroke="#7290b3" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="562" y1="305" x2="599" y2="305" stroke="#7290b3" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="747" y1="305" x2="784" y2="305" stroke="#7290b3" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1017" y1="305" x2="1054" y2="305" stroke="#7290b3" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="600" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#496987">Richer prefix representations for earlier and more accurate predictions</text>
</svg>
